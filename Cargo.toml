[package]
name = "crab_os"
version = "0.1.0"
edition = "2024"

[dependencies]
smoltcp = { version = "0.14.0", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "socket-dhcpv4", "socket-dns"] }
linked_list_allocator = "0.9.0"
volatile = "0.2.6"
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"
pic8259 = "0.11.0"
pc-keyboard = "0.7.0"
uefi = "0.41.0"
font8x8 = { version = "0.3.1", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lints.rust]
unused = "allow"

[[bin]]
name = "crab_os"
test = true
bench = false

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[[test]]
name = "stack_overflow"
harness = false

[dependencies.crossbeam-queue]
version = "0.3.11"
default-features = false
features = ["alloc"]

[dependencies.conquer-once]
version = "0.2.0"
default-features = false

[dependencies.futures-util]
version = "0.3.4"
default-features = false
features = ["alloc"]
